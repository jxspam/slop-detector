<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Slop Detector Settings</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 16px;
      width: 320px;
      background-color: #0f1419;
      color: #e7e9ea;
    }
    h1 {
      font-size: 16px;
      font-weight: 700;
      margin: 0 0 16px 0;
      color: #ffffff;
    }
    .field {
      margin-bottom: 14px;
    }
    label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 6px;
      color: #71767b;
    }
    input[type="number"],
    input[type="text"] {
      width: 100%;
      box-sizing: border-box;
      padding: 8px 10px;
      border-radius: 6px;
      border: 1px solid #333639;
      background-color: #16181c;
      color: #ffffff;
      font-size: 13px;
    }
    input:focus {
      outline: none;
      border-color: #1d9bf0;
    }
    button {
      width: 100%;
      padding: 9px;
      border-radius: 9999px;
      border: none;
      background-color: #eff3f4;
      color: #0f1419;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 6px;
    }
    button:hover {
      background-color: #d7dbdc;
    }
    #status {
      margin-top: 10px;
      font-size: 12px;
      text-align: center;
      color: #00ba7c;
      min-height: 16px;
    }
  </style>
</head>
<body>
  <h1>Slop Detector Settings</h1>
  <div class="field">
    <label for="highThreshold">Likely AI Slop Threshold</label>
    <input type="number" id="highThreshold" min="50" max="100" value="80">
  </div>
  <div class="field">
    <label for="checkThreshold">Check This Threshold</label>
    <input type="number" id="checkThreshold" min="10" max="79" value="40">
  </div>
  <div class="field">
    <label for="relayUrl">Relay Endpoint URL</label>
    <input type="text" id="relayUrl" value="http://127.0.0.1:3000/api/judge">
  </div>
  <button id="saveBtn">Save Settings</button>
  <div id="status"></div>
  <script src="options.js"></script>
</body>
</html>
