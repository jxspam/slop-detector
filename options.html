<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Slop Detector Settings</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 40px auto;
      max-width: 480px;
      color: #111;
      background: #fafafa;
    }
    h1 {
      font-size: 20px;
      margin-bottom: 24px;
    }
    .field {
      margin-bottom: 16px;
      display: flex;
      flex-direction: column;
    }
    label {
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 6px;
    }
    input[type="number"],
    input[type="text"] {
      padding: 8px 12px;
      font-size: 14px;
      border: 1px solid #ccc;
      border-radius: 6px;
      background: #fff;
    }
    input[type="color"] {
      width: 48px;
      height: 36px;
      padding: 2px;
      border: 1px solid #ccc;
      border-radius: 6px;
      cursor: pointer;
    }
    button {
      margin-top: 12px;
      padding: 10px 16px;
      font-size: 14px;
      font-weight: 600;
      color: #fff;
      background: #000;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
    #status {
      margin-top: 12px;
      font-size: 13px;
      color: #34C759;
      height: 18px;
    }
  </style>
</head>
<body>
  <h1>Slop Detector Settings</h1>

  <div class="field">
    <label for="highThreshold">High Threshold</label>
    <input type="number" id="highThreshold" min="1" max="100" value="80">
  </div>

  <div class="field">
    <label for="checkThreshold">Check Threshold</label>
    <input type="number" id="checkThreshold" min="1" max="100" value="40">
  </div>

  <div class="field">
    <label for="colorHigh">High Color</label>
    <input type="color" id="colorHigh" value="#FF3B30">
  </div>

  <div class="field">
    <label for="colorCheck">Check Color</label>
    <input type="color" id="colorCheck" value="#FF9500">
  </div>

  <div class="field">
    <label for="colorClean">Clean Color</label>
    <input type="color" id="colorClean" value="#34C759">
  </div>

  <div class="field">
    <label for="relayUrl">Relay Endpoint</label>
    <input type="text" id="relayUrl" value="http://127.0.0.1:8787">
  </div>

  <button id="save">Save</button>
  <div id="status"></div>

  <script src="options.js"></script>
</body>
</html>
