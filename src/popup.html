<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <style>
    body { font: 13px/1.5 system-ui, sans-serif; width: 280px; margin: 0; padding: 12px; color: #1c1917; }
    h1 { font-size: 14px; margin: 0 0 10px; display: flex; align-items: center; gap: 6px; }
    label { display: block; margin: 10px 0 2px; font-weight: 600; }
    select, input[type="number"] { width: 100%; box-sizing: border-box; padding: 4px 6px; }
    .row { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
    button { margin-top: 12px; width: 100%; padding: 6px; cursor: pointer; }
    #status { margin-top: 8px; font-size: 12px; color: #57534e; min-height: 18px; }
    .hint { color: #78716c; font-size: 11px; margin-top: 2px; }
  </style>
</head>
<body>
  <h1>🧹 Slop Detector</h1>
  <div class="row">
    <input type="checkbox" id="enabled" />
    <label for="enabled" style="margin:0">Enabled</label>
  </div>
  <label for="high">High confidence (LIKELY AI SLOP)</label>
  <input type="number" id="high" min="0.5" max="1" step="0.05" />
  <div class="hint">Cards at or above this get the badge with the score.</div>
  <label for="medium">Medium confidence (CHECK THIS)</label>
  <input type="number" id="medium" min="0" max="1" step="0.05" />
  <label for="mode">Display mode</label>
  <select id="mode">
    <option value="both">Badge + outline</option>
    <option value="badge">Badge only</option>
    <option value="outline">Outline only</option>
  </select>
  <button id="save">Save</button>
  <button id="test">Test key</button>
  <div id="status"></div>
  <script src="popup.js"></script>
</body>
</html>
