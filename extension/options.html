<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Slop Detector Settings</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      margin: 0;
      padding: 32px;
    }
    .container {
      max-width: 480px;
      margin: 0 auto;
      background-color: #1e293b;
      padding: 28px;
      border-radius: 12px;
      border: 1px solid #334155;
    }
    h1 {
      font-size: 20px;
      font-weight: 700;
      margin-top: 0;
      margin-bottom: 24px;
    }
    .field {
      margin-bottom: 20px;
    }
    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 8px;
      color: #cbd5e1;
    }
    input[type="number"],
    input[type="text"] {
      width: 100%;
      box-sizing: border-box;
      padding: 10px 12px;
      background-color: #0f172a;
      border: 1px solid #475569;
      border-radius: 6px;
      color: #f8fafc;
      font-size: 14px;
    }
    input[type="number"]:focus,
    input[type="text"]:focus {
      outline: none;
      border-color: #38bdf8;
    }
    .actions {
      display: flex;
      justify-content: flex-end;
      gap: 12px;
      margin-top: 24px;
    }
    button {
      padding: 10px 18px;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      border: none;
    }
    .btn-save {
      background-color: #ef4444;
      color: #ffffff;
    }
    .btn-save:hover {
      background-color: #dc2626;
    }
    .status {
      margin-top: 14px;
      font-size: 13px;
      color: #4ade80;
      display: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Slop Detector Settings</h1>

    <div class="field">
      <label for="highThreshold">High band threshold (likely AI slop badge)</label>
      <input type="number" id="highThreshold" min="50" max="100" value="80">
    </div>

    <div class="field">
      <label for="mediumThreshold">Medium band threshold (check this outline)</label>
      <input type="number" id="mediumThreshold" min="10" max="79" value="40">
    </div>

    <div class="field">
      <label for="relayUrl">Relay server URL</label>
      <input type="text" id="relayUrl" value="http://127.0.0.1:3824">
    </div>

    <div class="actions">
      <button id="save" class="btn-save">Save Settings</button>
    </div>

    <div id="status" class="status">Settings saved successfully</div>
  </div>

  <script src="options.js"></script>
</body>
</html>
